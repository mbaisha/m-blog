version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mblog-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mblog
      POSTGRES_USER: mblog_user
      POSTGRES_PASSWORD: mblog_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mblog_user -d mblog"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: