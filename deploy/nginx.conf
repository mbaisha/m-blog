# ==========================================
# MBlog 主 Nginx 反向代理配置
# 代理后端 API、前台 Next.js、后台管理
# ==========================================

# 上游定义
upstream backend_api {
    server api:5000;
}

upstream frontend_app {
    server frontend:3000;
}

upstream admin_app {
    server admin:80;
}

server {
    listen 80;
    server_name _;

    # 字符集
    charset utf-8;

    # 日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 文件大小限制（上传限制，支持大视频文件）
    client_max_body_size 210M;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # ===== 后端 API（大模型请求需要较长超时） =====
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;

        # CORS
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ===== 上传文件访问（图片/视频/附件）— 防盗链保护 =====
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";

# ~localhost(:[\d]+)?$
# ~127\.0\.0\.1(:[\d]+)?$
# ~\.imbs\.top$
        # 防盗链：允许的白名单来源（支持所有端口）
        valid_referers none blocked server_names
            ~localhost
            ~127\.0\.0\.1
            ~\.imbs\.top
            ~\.vxera\.com
            ~\.vxlife\.com
            ~\.jikd\.cn;
        if ($invalid_referer) {
            return 403;
        }

        # 如果文件不存在，回退到后端 API
        try_files $uri @backend_uploads;
    }

    # 访问被拒时返回警告图片
    error_page 403 = /hotlink-warning.svg;

    # 防盗链警告图片（不受防盗链限制）
    location = /hotlink-warning.svg {
        alias /var/www/hotlink-warning.svg;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "image/svg+xml";
    }

    # 上传文件回退到后端
    location @backend_uploads {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Referer "";  # 清除 Referer 避免被后端防盗链拦截
    }

    # ===== 后台管理 =====
    # 无尾部斜杠时 301 跳转到 /admin/
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://admin_app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重写 /admin/xxx -> /xxx （SPA 路由）
        proxy_redirect / /admin/;
    }

    # ===== 前台 =====
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # 旧文章 URL 跳转 /index.php/archives/数字/ → /articles/show-数字
    location ~ ^/index\.php/archives/(\d+)/$ {
        return 301 /articles/show-$1;
    }
}